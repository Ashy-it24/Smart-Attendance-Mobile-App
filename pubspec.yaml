name: smart_attendance
description: Smart Attendance Mobile App with face recognition
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '^3.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0

  # State management
  provider: ^6.1.0

  # Face recognition & ML
  google_mlkit_face_detection: ^0.14.0
  tflite_flutter: ^0.12.1
  camera: ^0.11.0
  image: ^4.0.0

  # Utilities
  path_provider: ^2.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
    - assets/images/
    - assets/icons/
