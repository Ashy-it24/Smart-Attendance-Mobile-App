name: smart_attendance
description: A Smart Attendance Management System using Face Recognition and Geofencing
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.0.5

  # Firebase
  cloud_firestore: ^4.8.5
  firebase_auth: ^4.9.0
  firebase_core: ^2.15.1
  firebase_storage: ^11.2.6

  # UI Components
  cupertino_icons: ^1.0.2
  flutter_screenutil: ^5.8.4
  go_router: ^10.1.2

  # Camera & ML
  camera: ^0.10.5+4
  google_mlkit_face_detection: ^0.10.0
  image: ^4.0.17
  tflite_flutter: ^0.10.4

  # Location
  geocoding: ^2.1.0
  geolocator: ^9.0.2

  # Utilities
  intl: ^0.18.1
  path_provider: ^2.1.1
  permission_handler: ^11.0.1
  shared_preferences: ^2.2.1

dev_dependencies:
  flutter_lints: ^2.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  
  assets:
    - assets/models/mobilefacenet.tflite
    - assets/images/
    - assets/icons/
